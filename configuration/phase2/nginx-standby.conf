# Phase 2 standby edge — Mac 3
# TLS certificate files must be provisioned separately.

upstream standby_backends {
    server 127.0.0.1:3001 max_fails=1 fail_timeout=10s;
    server 10.185.128.32:3002 max_fails=1 fail_timeout=10s;
}

server {
    listen 8443 ssl;
    server_name app.team1.test api.team1.test;

    ssl_certificate /Users/rachitsingh/team1-standby-certs/app.team1.test.crt;
    ssl_certificate_key /Users/rachitsingh/team1-standby-certs/app.team1.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://standby_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
