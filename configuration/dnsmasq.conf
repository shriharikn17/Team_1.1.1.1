# Team 1.1.1.1 dnsmasq configuration
# Active Homebrew path on Mac 1: /opt/homebrew/etc/dnsmasq.conf

# Team 1.1.1.1 private records
address=/app.team1.test/10.7.20.19
address=/api.team1.test/10.7.20.19

# Do not forward incomplete names or reverse queries for private ranges upstream.
domain-needed
bogus-priv

# Upstream public resolvers.
server=8.8.8.8
server=1.1.1.1

# Cache normal DNS responses.
cache-size=1000
